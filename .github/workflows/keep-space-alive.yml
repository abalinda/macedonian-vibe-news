name: Keep HF Space Alive

# Pings the HuggingFace Space's direct URL on a schedule so the Space
# registers activity and doesn't go to sleep (free Docker Spaces pause
# after ~48h without traffic). The scraper daemon in run_local.py serves
# a status page on port 7860, so a plain GET is enough.
#
# Optional: add an `HF_TOKEN` repo secret (a HuggingFace access token with
# write access to the Space) and the workflow will also call the HF restart
# API as a fallback whenever the ping fails — e.g. after a RUNTIME_ERROR.

on:
  schedule:
    - cron: '17 5 * * *'    # daily at 05:17 UTC (off the :00 rush)
    - cron: '17 17 * * *'   # and 17:17 UTC, in case one run is skipped
  workflow_dispatch: # manual run button

concurrency:
  group: keep-space-alive
  cancel-in-progress: true

env:
  SPACE_URL: https://vibesmk-scraper-claude-test.hf.space
  SPACE_ID: vibesmk/scraper_claude_test

jobs:
  ping:
    name: Ping Space
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🌐 Ping Space URL
        id: ping
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Attempt $attempt: GET $SPACE_URL"
            status=$(curl -sS -o /tmp/body.html -w '%{http_code}' --max-time 60 "$SPACE_URL/")
            echo "HTTP $status"
            if [ "$status" = "200" ]; then
              echo "✅ Space is up:"
              cat /tmp/body.html
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "❌ Space did not return 200 after 3 attempts"
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: 🔁 Restart Space via HF API (fallback)
        if: steps.ping.outputs.ok == 'false' && secrets.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Requesting restart of $SPACE_ID..."
          curl -sS -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            --max-time 60 \
            "https://huggingface.co/api/spaces/$SPACE_ID/restart"
          echo ""
          echo "Waiting 90s for the Space to boot..."
          sleep 90
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$SPACE_URL/")
          echo "Post-restart HTTP $status"
          [ "$status" = "200" ]

      - name: 🚨 Fail if Space is down
        if: steps.ping.outputs.ok == 'false' && secrets.HF_TOKEN == ''
        run: |
          echo "Space is unreachable and no HF_TOKEN secret is set to attempt a restart."
          echo "Check the container logs: https://huggingface.co/spaces/$SPACE_ID?logs=container"
          exit 1
